<!-- Spinner while loading -->
@if (loading) {
  <div class="d-flex justify-content-center my-4">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
}

<!-- Rendered markdown -->
@if (!loading) {
  <div class="markdown-body" [innerHTML]="html"></div>
}
